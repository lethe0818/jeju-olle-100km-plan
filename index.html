<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073f43">
  <meta name="description" content="2026年9月济州偶来100 km移动行程助手">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="济州偶来">
  <title>济州偶来 · 行程助手</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/app-icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <button class="brand-button" type="button" data-view-target="today" aria-label="返回今日行程">
        <img src="assets/app-icon-192.png" alt="">
        <span><b>济州偶来</b><small>100 KM TRIP</small></span>
      </button>
      <div class="app-status">
        <span id="network-status" class="network-status"><i></i>在线</span>
        <button id="install-shortcut" class="icon-button" type="button" aria-label="安装到手机桌面" title="安装到手机桌面" hidden>
          <img src="assets/icons/download.svg" alt="">
        </button>
      </div>
    </div>
  </header>

  <main id="app-main" class="app-main">
    <section id="view-today" class="app-view" data-view="today" aria-labelledby="today-title">
      <div class="view-shell today-shell">
        <div id="today-overview"></div>
        <nav id="today-day-tabs" class="date-strip" aria-label="选择日期"></nav>
        <div id="today-content" aria-live="polite"></div>
      </div>
    </section>

    <section id="view-plan" class="app-view" data-view="plan" aria-labelledby="plan-title" hidden>
      <div class="view-shell">
        <header class="view-heading">
          <div><p class="overline">FULL ITINERARY</p><h1 id="plan-title">完整计划</h1></div>
          <button class="icon-button" id="print-button" type="button" aria-label="打印或导出PDF" title="打印或导出PDF"><img src="assets/icons/printer.svg" alt=""></button>
        </header>
        <nav id="plan-day-tabs" class="date-strip" aria-label="选择计划日期"></nav>
        <div id="plan-content" aria-live="polite"></div>
      </div>
    </section>

    <section id="view-checkins" class="app-view" data-view="checkins" aria-labelledby="checkins-title" hidden>
      <div class="view-shell">
        <header class="view-heading checkin-heading">
          <div><p class="overline">PLACES TO SAVE</p><h1 id="checkins-title">打卡清单</h1></div>
          <button class="primary-icon-button" type="button" data-open-checkin aria-label="新增打卡点" title="新增打卡点"><img src="assets/icons/plus.svg" alt=""></button>
        </header>
        <div class="checkin-search">
          <label for="checkin-search-input"><img src="assets/icons/search.svg" alt=""><input id="checkin-search-input" type="search" autocomplete="off" placeholder="搜索地点、韩文名或推荐内容"></label>
          <button type="button" data-clear-checkin-search aria-label="清除搜索" title="清除搜索" hidden><img src="assets/icons/x.svg" alt=""></button>
        </div>
        <div class="filter-block" aria-label="打卡点筛选">
          <div class="chip-scroll"><div id="checkin-day-filter" class="chip-row"></div></div>
          <div class="chip-scroll"><div id="checkin-category-filter" class="chip-row"></div></div>
        </div>
        <div id="checkin-list" class="checkin-list" aria-live="polite"></div>
      </div>
    </section>

    <section id="view-more" class="app-view" data-view="more" aria-labelledby="more-title" hidden>
      <div class="view-shell">
        <header class="view-heading">
          <div><p class="overline">TRIP CONTROL</p><h1 id="more-title">更多</h1></div>
        </header>
        <div id="more-content"></div>
      </div>
    </section>
  </main>

  <nav class="app-dock" aria-label="主导航">
    <button type="button" data-view-target="today" aria-current="page"><img src="assets/icons/house.svg" alt=""><span>今日</span></button>
    <button type="button" data-view-target="plan"><img src="assets/icons/calendar-days.svg" alt=""><span>计划</span></button>
    <button class="dock-add" type="button" data-open-quick-add aria-label="快速新增"><span><img src="assets/icons/plus.svg" alt=""></span><small>新增</small></button>
    <button type="button" data-view-target="checkins"><img src="assets/icons/map-pin-check.svg" alt=""><span>打卡</span></button>
    <button type="button" data-view-target="more"><img src="assets/icons/ellipsis.svg" alt=""><span>更多</span></button>
  </nav>

  <dialog id="quick-add-dialog" class="bottom-sheet quick-add-sheet" aria-labelledby="quick-add-title">
    <section class="quick-add-content">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <div><p class="overline">QUICK ADD</p><h2 id="quick-add-title">新增</h2></div>
        <button class="icon-button" type="button" data-close-quick-add aria-label="关闭"><img src="assets/icons/x.svg" alt=""></button>
      </header>
      <div class="quick-add-options">
        <button type="button" data-quick-checkin><span><img src="assets/icons/map-pin-check.svg" alt=""></span><b>打卡点</b><small>美食、景点或购物</small></button>
        <button type="button" data-quick-expense><span><img src="assets/icons/receipt-text.svg" alt=""></span><b>记一笔</b><small>记录旅行花销</small></button>
      </div>
    </section>
  </dialog>

  <dialog id="expense-dialog" class="bottom-sheet expense-sheet" aria-labelledby="expense-form-title">
    <form id="expense-form" method="dialog" novalidate>
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <div><p class="overline">TRIP EXPENSE</p><h2 id="expense-form-title">记一笔</h2></div>
        <button class="icon-button" type="button" data-close-expense aria-label="关闭"><img src="assets/icons/x.svg" alt=""></button>
      </header>
      <input id="expense-id" type="hidden">

      <fieldset class="category-picker expense-category-picker">
        <legend>支出分类</legend>
        <label><input type="radio" name="expenseCategory" value="transport" checked><span><img src="assets/icons/navigation.svg" alt="">交通</span></label>
        <label><input type="radio" name="expenseCategory" value="food"><span><img src="assets/icons/utensils.svg" alt="">餐饮</span></label>
        <label><input type="radio" name="expenseCategory" value="stay"><span><img src="assets/icons/house.svg" alt="">住宿</span></label>
        <label><input type="radio" name="expenseCategory" value="ticket"><span><img src="assets/icons/bookmark.svg" alt="">门票</span></label>
        <label><input type="radio" name="expenseCategory" value="shopping"><span><img src="assets/icons/shopping-bag.svg" alt="">购物</span></label>
        <label><input type="radio" name="expenseCategory" value="other"><span><img src="assets/icons/ellipsis.svg" alt="">其他</span></label>
      </fieldset>

      <div class="form-grid">
        <label class="field span-2"><span>项目 <b>*</b></span><input id="expense-title" name="title" required maxlength="120" autocomplete="off" placeholder="例如：机场到酒店出租车"></label>
        <label class="field"><span>金额 <b>*</b></span><input id="expense-amount" name="amount" required inputmode="decimal" autocomplete="off" placeholder="0"></label>
        <div class="field currency-field">
          <span aria-hidden="true">币种</span>
          <fieldset class="currency-picker">
            <legend>币种</legend>
            <label><input type="radio" name="currency" value="KRW" checked><span>₩ 韩元</span></label>
            <label><input type="radio" name="currency" value="CNY"><span>¥ 人民币</span></label>
          </fieldset>
        </div>
        <label class="field"><span>日期 <b>*</b></span><select id="expense-day" name="dayId" required></select></label>
        <label class="field"><span>付款方式</span><select id="expense-payment" name="payment"><option value="card">银行卡</option><option value="cash">现金</option><option value="alipay">支付宝</option><option value="wechat">微信</option><option value="other">其他</option></select></label>
        <label class="field span-2"><span>备注</span><textarea id="expense-note" name="note" rows="3" maxlength="500" placeholder="同行分摊、票据或其他说明"></textarea></label>
      </div>
      <p id="expense-form-error" class="form-error" role="alert"></p>
      <footer class="sheet-actions">
        <button class="text-button" type="button" data-close-expense>取消</button>
        <button class="primary-button" type="submit">保存支出</button>
      </footer>
    </form>
  </dialog>

  <dialog id="checkin-dialog" class="bottom-sheet" aria-labelledby="checkin-form-title">
    <form id="checkin-form" method="dialog" novalidate>
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <div><p class="overline">NEW PLACE</p><h2 id="checkin-form-title">新增打卡点</h2></div>
        <button class="icon-button" type="button" data-close-checkin aria-label="关闭"><img src="assets/icons/x.svg" alt=""></button>
      </header>
      <input id="checkin-id" type="hidden">

      <fieldset class="category-picker">
        <legend>分类</legend>
        <label><input type="radio" name="category" value="food" checked><span><img src="assets/icons/utensils.svg" alt="">美食</span></label>
        <label><input type="radio" name="category" value="cafe"><span><img src="assets/icons/coffee.svg" alt="">咖啡甜品</span></label>
        <label><input type="radio" name="category" value="scenic"><span><img src="assets/icons/camera.svg" alt="">景点</span></label>
        <label><input type="radio" name="category" value="shopping"><span><img src="assets/icons/shopping-bag.svg" alt="">购物</span></label>
        <label><input type="radio" name="category" value="other"><span><img src="assets/icons/bookmark.svg" alt="">其他</span></label>
      </fieldset>

      <div class="form-grid">
        <label class="field span-2"><span>地点名称 <b>*</b></span><input id="checkin-name" name="name" required autocomplete="off" placeholder="例如：海女之家"></label>
        <label class="field span-2"><span>安排日期 <b>*</b></span><select id="checkin-day" name="dayId" required></select></label>
      </div>

      <details class="advanced-fields checkin-details">
        <summary><span>补充定位与详情</span><small id="location-state">可稍后补充</small></summary>
        <section class="location-panel">
          <div class="form-section-title"><div><img src="assets/icons/map-pin.svg" alt=""><span>地图定位</span></div></div>
          <label class="field"><span>地图链接或坐标</span><input id="checkin-map-input" name="mapInput" inputmode="url" placeholder="粘贴 Kakao / Naver 链接或 33.2, 126.5"></label>
          <div class="location-actions">
            <button id="parse-location" class="secondary-button" type="button"><img src="assets/icons/search.svg" alt="">解析定位</button>
            <button id="use-location" class="secondary-button" type="button"><img src="assets/icons/navigation.svg" alt="">使用当前位置</button>
          </div>
          <div class="coordinate-grid">
            <label class="field"><span>纬度</span><input id="checkin-lat" name="lat" inputmode="decimal" placeholder="33.000000"></label>
            <label class="field"><span>经度</span><input id="checkin-lng" name="lng" inputmode="decimal" placeholder="126.000000"></label>
          </div>
        </section>
        <div class="form-grid advanced-grid">
          <label class="field"><span>交通方式</span><select id="checkin-mode" name="mode"><option value="步行">步行</option><option value="公交">公交</option><option value="打车">打车</option><option value="骑行">骑行</option></select></label>
          <label class="field"><span>优先级</span><select id="checkin-priority" name="priority"><option>想去</option><option>必打卡</option><option>顺路</option><option>备选</option></select></label>
          <label class="field"><span>韩文名称</span><input id="checkin-korean" name="korean" autocomplete="off" placeholder="한국어 이름"></label>
          <label class="field"><span>计划时段</span><input id="checkin-slot" name="slot" placeholder="例如：返港后 13:30"></label>
          <label class="field span-2"><span>地址</span><input id="checkin-address" name="address" autocomplete="street-address" placeholder="韩文地址最方便司机确认"></label>
          <label class="field"><span>推荐内容</span><input id="checkin-dish" name="dish" placeholder="招牌菜或想看的内容"></label>
          <label class="field span-2"><span>备注</span><textarea id="checkin-note" name="note" rows="3" placeholder="排队上限、休息日、是否适合独自用餐……"></textarea></label>
        </div>
      </details>
      <p id="checkin-form-error" class="form-error" role="alert"></p>
      <footer class="sheet-actions">
        <button class="text-button" type="button" data-close-checkin>取消</button>
        <button class="primary-button" type="submit">保存打卡点</button>
      </footer>
    </form>
  </dialog>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <div id="update-banner" class="update-banner" role="status" hidden><span>行程助手有新版本</span><button id="apply-update" type="button">立即更新</button></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
